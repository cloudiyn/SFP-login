<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProjectGraph 查看器</title>
<style>
  :root {
    --bg: #1e1e2e; --panel: #27273a; --border: #3a3a52; --text: #cdd6f4;
    --muted: #7f849c; --accent: #89b4fa; --node-bg: #313244; --node-border: #585b70;
    --edge: #6c7086; --section-border: #45475a; --section-bg: rgba(69,71,90,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  #toolbar { position: fixed; top: 0; left: 0; right: 0; height: 44px; display: flex;
    align-items: center; gap: 10px; padding: 0 14px; background: var(--panel);
    border-bottom: 1px solid var(--border); z-index: 10; font-size: 13px; }
  #toolbar .title { font-weight: 600; color: var(--accent); }
  #toolbar .meta { color: var(--muted); font-size: 12px; }
  #toolbar button { background: var(--node-bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 12px; }
  #toolbar button:hover { border-color: var(--accent); }
  #toolbar .spacer { flex: 1; }
  #stage { position: absolute; inset: 44px 0 0 0; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #stage svg { display: block; }
  .node rect { fill: var(--node-bg); stroke: var(--node-border); stroke-width: 1.5; rx: 8; }
  .node text { fill: var(--text); font-size: 14px; }
  .node.image rect, .node.svg rect, .node.media rect, .node.referenceblock rect { stroke-dasharray: 4 3; }
  .node.connectpoint ellipse { fill: #585b70; stroke: #cdd6f4; }
  .node.penstroke path { stroke: var(--node-border); stroke-width: 2; fill: none; stroke-linecap: round; }
  .edge path { stroke: var(--edge); stroke-width: 1.5; fill: none; }
  .edge text { fill: var(--muted); font-size: 12px; }
  .edge.multi path { stroke-dasharray: 6 4; }
  .section > rect { fill: var(--section-bg); stroke: var(--section-border); stroke-width: 1.5;
    stroke-dasharray: 8 4; rx: 12; }
  .section > text { fill: var(--muted); font-size: 13px; font-weight: 600; }
  #hint { position: fixed; bottom: 12px; left: 14px; color: var(--muted); font-size: 12px; z-index: 5; }
</style>
</head>

</div>

const svg = document.getElementById('svg');
const NS = 'http://www.w3.org/2000/svg';
let view = { x: 0, y: 0, k: 1 };

document.getElementById('meta').textContent =
  (DATA.meta.version ? 'v' + DATA.meta.version + ' · ' : '') +
  DATA.nodes.length + ' 节点 · ' + DATA.sections.length + ' 分组 · ' + DATA.edges.length + ' 边';

const uuidToNode = new Map();
DATA.nodes.forEach(n => uuidToNode.set(n.uuid, n));
DATA.sections.forEach(s => { s.children.forEach(cid => { if (!uuidToNode.has(cid)) uuidToNode.set(cid, {uuid: cid, w:100,h:40,x:s.x,y:s.y}); }); });

const world = document.createElementNS(NS, 'g');
svg.appendChild(world);

function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || world).appendChild(e);
  return e;
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function centerOf(n) { return { x: n.x + (n.w||100)/2, y: n.y + (n.h||40)/2 }; }
function colorFill(c) { return (c && c.a > 0) ? 'rgb(' + c.r + ',' + c.g + ',' + c.b + ')' : null; }

for (const s of DATA.sections) {
  const g = el('g', { class: 'section' });
  el('rect', { x: s.x, y: s.y, width: Math.max(s.w, 10), height: Math.max(s.h, 10) }, g);
  const t = el('text', { x: s.x + 10, y: s.y + 22 }, g);
  t.textContent = esc(s.label || '分组');
}

const defs = el('defs', {});
const marker = el('marker', { id: 'arrow', viewBox: '0 0 10 10', refX: 9, refY: 5,
  markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs);
el('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: '#6c7086' }, marker);

for (const e of DATA.edges) {
  if (e.type === 'MultiTargetUndirectedEdge') {
    let cx = 0, cy = 0, n = 0;
    for (const tid of (e.targets || [])) {
      const t = uuidToNode.get(tid);
      if (!t) continue;
      const c = centerOf(t); cx += c.x; cy += c.y; n++;
    }
    if (n === 0) continue;
    cx /= n; cy /= n;
    const g = el('g', { class: 'edge multi' });
    for (const tid of (e.targets || [])) {
      const t = uuidToNode.get(tid);
      if (!t) continue;
      const c = centerOf(t);
      el('path', { d: 'M ' + cx + ' ' + cy + ' L ' + c.x + ' ' + c.y }, g);
    }
    if (e.label) {
      const t = el('text', { x: cx + 8, y: cy - 8 }, g);
      t.textContent = esc(e.label);
    }
    continue;
  }
  const a = uuidToNode.get(e.from);
  const b = uuidToNode.get(e.to);
  if (!a || !b) continue;
  const p1 = centerOf(a), p2 = centerOf(b);
  const g = el('g', { class: 'edge' });
  let d, mid;
  if (e.type === 'ArcEdge' && e.offset) {
    const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    const px = -dy / len, py = dx / len;
    const cxp = mx + px * e.offset, cyp = my + py * e.offset;
    d = 'M ' + p1.x + ' ' + p1.y + ' Q ' + cxp + ' ' + cyp + ' ' + p2.x + ' ' + p2.y;
    mid = { x: 0.25*p1.x + 0.5*cxp + 0.25*p2.x, y: 0.25*p1.y + 0.5*cyp + 0.25*p2.y };
  } else {
    d = 'M ' + p1.x + ' ' + p1.y + ' L ' + p2.x + ' ' + p2.y;
    mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
  }
  el('path', { d: d, 'marker-end': 'url(#arrow)' }, g);
  if (e.label) {
    const t = el('text', { x: mid.x, y: mid.y - 6, 'text-anchor': 'middle' }, g);
    t.textContent = esc(e.label);
  }

for (const n of DATA.nodes) {
  const g = el('g', { class: 'node ' + (n.type || '').toLowerCase() });
  const fill = colorFill(n.color);
  const w = Math.max(n.w || 100, 10), h = Math.max(n.h || 40, 10);
  if (n.type === 'ConnectPoint') {
    el('ellipse', { cx: n.x + w/2, cy: n.y + h/2, rx: 15, ry: 15 }, g);
  } else if (n.type === 'PenStroke') {
    const pts = n.points || [];
    if (pts.length > 1) {
      const d = 'M ' + pts.map(p => p[0] + ' ' + p[1]).join(' L ');
      el('path', { d: d, stroke: fill || '#585b70' }, g);
    }
  } else {
    el('rect', { x: n.x, y: n.y, width: w, height: h,
      fill: fill || 'var(--node-bg)', stroke: 'rgba(255,255,255,0.25)' }, g);
    if (n.image) {
      el('image', { x: n.x + 2, y: n.y + 2, width: w - 4, height: h - 4,
        href: n.image, preserveAspectRatio: 'xMidYMid meet' }, g);
    } else if (n.svg) {
      el('image', { x: n.x + 2, y: n.y + 2, width: w - 4, height: h - 4,
        href: n.svg, preserveAspectRatio: 'xMidYMid meet' }, g);
    } else if (n.label) {
      const lines = String(n.label).split('\n');
      lines.forEach((line, i) => {
        const t = el('text', { x: n.x + 12, y: n.y + 24 + i * 18 }, g);
        t.textContent = esc(line);
      });
    }
    if (n.type === 'MediaNode') {
      const t = el('text', { x: n.x + 12, y: n.y + 24 }, g);
      t.textContent = (n.mediaKind === 'audio' ? '♪ ' : '▶ ') + esc(n.label || '媒体');
    }
    if (n.type === 'ReferenceBlockNode') {
      const t = el('text', { x: n.x + 12, y: n.y + 24 }, g);
      t.textContent = '引用: ' + esc(n.fileName || '');
    }
    if (n.type === 'ExtensionEntity') {
      const t = el('text', { x: n.x + 12, y: n.y + 24 }, g);
      t.textContent = esc(n.typeName || '扩展');
    }
  }
  const title = el('title', {}, g);
  title.textContent = (n.type || '') + ' · ' + (n.label || n.uuid || '');
}

function contentBBox() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const all = DATA.nodes.concat(DATA.sections);
  for (const n of all) {
    if (n.type === 'PenStroke') {
      for (const p of (n.points || [])) {
        minX = Math.min(minX, p[0]); minY = Math.min(minY, p[1]);
        maxX = Math.max(maxX, p[0]); maxY = Math.max(maxY, p[1]);
      }
      continue;
    }
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + (n.w || 100)); maxY = Math.max(maxY, n.y + (n.h || 40));
  }
  if (!isFinite(minX)) return { x: 0, y: 0, w: 800, h: 600 };
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}
function resetView() {
  const b = contentBBox();
  const rect = document.getElementById('stage').getBoundingClientRect();
  const k = Math.min((rect.width - 60) / Math.max(b.w, 1), (rect.height - 60) / Math.max(b.h, 1), 2);
  view.k = k;
  view.x = (rect.width - b.w * k) / 2 - b.x * k;
  view.y = (rect.height - b.h * k) / 2 - b.y * k;
  applyView();
}
function zoomBy(f) {
  const rect = document.getElementById('stage').getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const k2 = view.k * f;
  view.x = cx - (cx - view.x) * (k2 / view.k);
  view.y = cy - (cy - view.y) * (k2 / view.k);
  view.k = k2;
  applyView();
}
function applyView() {
  world.setAttribute('transform', 'translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')');
}
const stage = document.getElementById('stage');
let drag = null;
stage.addEventListener('mousedown', (e) => {
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
  stage.classList.add('dragging');
});
window.addEventListener('mousemove', (e) => {
  if (!drag) return;
  view.x = drag.vx + (e.clientX - drag.x);
  view.y = drag.vy + (e.clientY - drag.y);
  applyView();
});
window.addEventListener('mouseup', () => { drag = null; stage.classList.remove('dragging'); });
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = stage.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const f = e.deltaY < 0 ? 1.1 : 0.9;
  const k2 = view.k * f;
  view.x = mx - (mx - view.x) * (k2 / view.k);
  view.y = my - (my - view.y) * (k2 / view.k);
  view.k = k2;
  applyView();
}, { passive: false });

window.addEventListener('resize', () => { svg.setAttribute('width', stage.clientWidth); svg.setAttribute('height', stage.clientHeight); });
svg.setAttribute('width', stage.clientWidth);
svg.setAttribute('height', stage.clientHeight);
resetView();
applyView();
