qq-whitelist {
  group {
    usage {
      bind = "Usage: <keyword> <code> (the code is shown when you are kicked for not being bound)"
      unbind = "Usage: <keyword> <playerName>"
    }
    code-not-found = "Invalid or already used code, please rejoin the server to get a new one"
    code-expired = "The code has expired, please rejoin the server to get a new one"
    code-attempts = "Too many failed attempts, the code has been voided. Please rejoin the server"
    bind-success = "Bound: <player> → QQ <qq> (<count>/<max>)"
    already-bound = "<player> is already bound to this QQ"
    limit-reached = "This QQ reached the binding limit (<max> accounts), unbind one first"
    profile-conflict = "<player> is already bound to another QQ, ask that QQ to unbind first"
    status-empty = "This QQ has no bound account yet"
    status-header = "This QQ bound <count> account(s):"
    status-line = "- <player>"
    unbind-success = "Unbound <player>"
    unbind-not-found = "No account bound to this QQ: <player>"
  }

  player {
    only-player = "This command can only be used by a player"
    command-only-game = "This command is only available in the game area"
    unbound-kick = "You have not bound a QQ to the whitelist yet.\nSend in the configured QQ group: <keyword> <code>\nCode: <code> (valid for 10 minutes, single use)"
    bound-notice = "Your QQ (<qq>) whitelist binding is now active"
    usage = "/qq to view your binding, /qq unbind to unbind"
    unbind-success = "Unbound account <player>"
    unbind-not-found = "You have no binding record"
    status-unbound = "You have not bound a QQ yet, send the bind command in the group"
    status-bound = "Bound QQ: <qq> (account <player>)"
  }

  admin {
    usage = "/qqadmin unbind <playerName> or /qqadmin reload"
    unbind-success = "Force-unbound <player> (QQ <qq>)"
    unbind-not-found = "No binding record for player <player>"
    reload-done = "QQ whitelist messages reloaded"
  }
}
