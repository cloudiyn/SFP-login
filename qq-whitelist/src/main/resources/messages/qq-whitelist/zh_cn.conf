  admin {
    usage = "/qqadmin unbind <玩家名> 或 /qqadmin reload"
    unbind-success = "已强制解绑 <player>（QQ <qq>）"
    unbind-not-found = "没有找到玩家 <player> 的绑定记录"
    reload-done = "QQ 白名单文案已重新加载"
