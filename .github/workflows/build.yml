name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The whole project targets Java 25 (subprojects sets jvmToolchain(25));
          # :vc-runtest compiles with --release 25, so a non-25 JDK fails with
          # "release version 25 not supported".
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build, spotless and tests
        # `build` depends on spotlessCheck and every module's test task,
        # so a single invocation covers compile + license header + formatting + tests.
        run: ./gradlew build --stacktrace

      - name: Build distributions
        # The CTD flavor and the all-in-one packages are slow and only matter for
        # releases, so they run on pushes to the default branch only.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew buildAllDistributions buildCtdDistributions --stacktrace

      - name: Upload plugin jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfp-login-jars
          if-no-files-found: ignore
          retention-days: 7
          path: |
            velocity/build/libs/*.jar

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
